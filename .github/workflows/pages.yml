name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

# Allow the deploy action to request an OIDC id-token.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Warn if Pages unavailable
        if: failure()
        run: |
          echo "GitHub Pages deployment failed or is unavailable for this org.\nConsider connecting the repo to Netlify (https://app.netlify.com) for free automatic deployments."
